{% extends "base.html" %}
{% block title %}Server Error — CrimeAware India{% endblock %}
{% block content %}
<div class="page" style="display:flex;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px 20px">
  <div>
    <div style="font-size:5rem;margin-bottom:20px">⚠️</div>
    <h1 style="color:var(--white);font-size:3rem">500</h1>
    <h2 style="color:var(--muted);margin-bottom:16px">Internal Server Error</h2>
    <p style="color:var(--muted);max-width:400px;margin:0 auto 32px">Something went wrong on our end. Please try again in a moment.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-primary">🏠 Go Home</a>
      <a href="/dashboard" class="btn btn-outline">📊 Dashboard</a>
    </div>
    <p style="color:var(--muted);margin-top:32px;font-size:.9rem">Emergency? Call <a href="tel:112" style="color:var(--accent)">112</a></p>
  </div>
</div>
{% endblock %}
