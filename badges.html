{% extends "base.html" %}
{% block title %}Badges — CrimeAware India{% endblock %}
{% block content %}
<div class="page" style="padding:40px 20px">
  <div class="container" style="max-width:800px;margin:0 auto">
    <div style="text-align:center;margin-bottom:36px" class="fade-up">
      <div class="eyebrow">Your Achievements</div>
      <h1 style="color:var(--white)">🏆 Badge Collection</h1>
      <p style="color:var(--muted)">Earn badges by completing the legal awareness quiz. <span id="xpTotal" style="color:#f59e0b;font-weight:700"></span></p>
    </div>
    <div id="badgeGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px"></div>
    <div style="text-align:center;margin-top:32px"><a href="/quiz" class="btn btn-primary">🧠 Take Quiz to Earn More</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const BADGES_DEF=[
  {id:'legal_eagle',name:'Legal Eagle',icon:'🦅',desc:'Get 5 IPC questions right in one session',xp:50},
  {id:'perfect_score',name:'Perfect Score',icon:'💯',desc:'Score 10/10 in one attempt',xp:100},
  {id:'cyber_guardian',name:'Cyber Guardian',icon:'🔐',desc:'Get all Cyber Safety questions right',xp:75},
  {id:'rights_warrior',name:'Rights Warrior',icon:'⚔️',desc:'Answer all CrPC/RTI questions correctly',xp:75},
  {id:'safety_champion',name:'Safety Champion',icon:'🛡️',desc:'Complete the quiz 3 times',xp:60},
];
const earned=JSON.parse(localStorage.getItem('crimeaware_badges')||'[]');
const xp=localStorage.getItem('crimeaware_xp')||0;
document.getElementById('xpTotal').textContent='Total XP: '+xp;
const grid=document.getElementById('badgeGrid');
BADGES_DEF.forEach(b=>{
  const unlocked=earned.includes(b.id);
  const card=document.createElement('div');
  card.style.cssText=`background:var(--bg2);border:1px solid ${unlocked?'#8b5cf6':'var(--border)'};border-radius:12px;padding:24px;text-align:center;opacity:${unlocked?1:0.5}`;
  card.innerHTML=`
    <div style="font-size:3rem;margin-bottom:12px">${unlocked?b.icon:'🔒'}</div>
    <div style="font-weight:700;color:${unlocked?'var(--white)':'var(--muted)'};margin-bottom:8px">${b.name}</div>
    <div style="color:var(--muted);font-size:.85rem;margin-bottom:12px">${b.desc}</div>
    <div style="color:#f59e0b;font-size:.8rem">+${b.xp} XP</div>
    ${unlocked?'<div style="margin-top:10px;color:#22c55e;font-size:.8rem">✅ Earned</div>':'<div style="margin-top:10px;color:var(--muted);font-size:.8rem">Not yet earned</div>'}
  `;
  grid.appendChild(card);
});
</script>
{% endblock %}
